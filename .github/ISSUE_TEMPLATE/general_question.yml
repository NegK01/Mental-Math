name: "❓ General Question or Technical Inquiry"
description: "Ask questions about the architecture, how to clone the project, or development inquiries."
title: "[QUESTION]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Do you have questions about the architecture, compilation, or internal workings of **Mental Math**? Ask here.

  - type: textarea
    id: question
    attributes:
      label: Your Question or Inquiry
      description: Describe your question clearly.
      placeholder: How is the daily streak state managed between Room and the Home ViewModel?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: If you are trying to build or learn from a specific component, please mention it.
    validations:
      required: false
