name: "💡 Feature Request"
description: "Suggest a new feature, visual change, or UX enhancement for Mental Math."
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting improvements for **Mental Math**! Tell us about your idea.

  - type: textarea
    id: problem
    attributes:
      label: What problem or need does this idea solve?
      description: Explain the context or why this feature would be valuable to users.
      placeholder: I would like to see a chart of my historical accuracy by each math operator...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution Description
      description: Explain in detail how you imagine the screen or component should work.
      placeholder: Add a stats tab or modal with interactive charts using Compose Canvas.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or different approaches?
    validations:
      required: false

  - type: textarea
    id: visual_mockups
    attributes:
      label: Mockups / Visual References
      description: Paste designs, sketches, or reference screenshots if available.
    validations:
      required: false
