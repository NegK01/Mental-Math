name: "💡 Feature Request"
description: "Suggest an idea, new feature, or improvement for Mental Math."
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting improvements for Mental Math! Share your thoughts below so we can consider them for future updates.

  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: What would you like to see added or changed, and how should it work?
      placeholder: A new practice mode, custom timer setting, etc.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Any extra thoughts on why this would be a great addition.
    validations:
      required: false

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / Visual References (optional)
      description: Drag and drop any visual references or mockups if you have them.
    validations:
      required: false
