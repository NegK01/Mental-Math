name: "🐛 Bug Report"
description: "Create a detailed report about a bug or unexpected behavior in the app."
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug in **Mental Math**! Please provide the necessary information to help reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Explain clearly and concisely what is happening.
      placeholder: When tapping the pause button on GameScreen, the screen freezes...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the bug.
      placeholder: |
        1. Open the app.
        2. Select Hard difficulty.
        3. Start a game and quickly press 'Pause'.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen normally.
      placeholder: The pause dialog should display smoothly without freezing the animation.
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android Version
      description: Device model and OS version.
      placeholder: Samsung Galaxy S23 (Android 14) / Pixel 7 (Android 15)
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logcat
      description: Drag or paste images or stack traces (Logcat) if available.
    validations:
      required: false
